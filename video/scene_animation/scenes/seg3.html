<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 3 段：四種客群</title>
<link rel="stylesheet" href="common.css">
<style>
  .title { left: 120px; top: 90px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 8px; }
  #intro { left: 760px; top: 110px; font-size: 30px; font-weight: 500; color: var(--navy); }
  /* 四個客群面板 */
  .persona { top: 230px; width: 330px; height: 440px; padding: 24px 24px 20px; box-sizing: border-box; text-align: center; }
  .persona .stage { position: relative; height: 200px; }
  .persona .slab { position: absolute; left: 30px; right: 30px; bottom: 0; height: 34px; transform: skewX(-18deg); }
  .persona svg.fig { position: absolute; left: 50%; bottom: 16px; width: 170px; height: 170px; margin-left: -85px; }
  .persona .badge { position: absolute; right: 18px; top: 0; width: 72px; height: 72px; border-radius: 20px; background: var(--pale); border: 2px solid var(--sky); display: flex; align-items: center; justify-content: center; }
  .persona .nm { font-size: 32px; font-weight: 700; color: var(--ink); margin-top: 14px; }
  .persona .tr { font-size: 22px; color: var(--navy); margin-top: 4px; }
  .persona .cnt { font-size: 60px; font-weight: 700; color: var(--blue); line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .persona .cnt small { font-size: 24px; color: var(--navy); margin-left: 4px; }
  .persona .most { position: absolute; left: 18px; top: 18px; font-size: 18px; color: #fff; background: var(--blue); padding: 3px 12px; border-radius: 999px; }
  /* 觀察名單 */
  #watch { left: 560px; top: 730px; width: 800px; height: 190px; padding: 22px 30px; box-sizing: border-box; display: flex; align-items: center; gap: 26px; }
  #watch svg.fig { width: 120px; height: 120px; flex: none; }
  #watch .t { font-size: 30px; font-weight: 700; color: var(--navy); }
  #watch .t small { display: block; font-size: 20px; color: #6B7A90; font-weight: 400; margin-top: 6px; }
  #watch .cnt { font-size: 60px; font-weight: 700; color: var(--grey); line-height: 1; margin-left: auto; }
  #watch .cnt small { font-size: 24px; margin-left: 4px; }
  #stamp { left: 1250px; top: 700px; font-size: 40px; font-weight: 700; color: var(--red); border: 5px solid var(--red); border-radius: 14px; padding: 6px 22px; letter-spacing: 6px; background: rgba(255,255,255,.85); }
  #stamp { transform-origin: center; }
  .foot { left: 150px; top: 860px; }
</style>
</head>
<body>
<div id="stage">
  <div class="halo blue" style="left:-300px;top:-300px;width:1200px;height:1200px;"></div>
  <div class="halo white" style="left:900px;top:300px;width:1200px;height:1200px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1500px;top:-300px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:500px;top:-300px;opacity:.3"></div>
  <div class="bokeh soft bk" style="left:1700px;top:120px;width:140px;height:140px;"></div>
  <div class="bokeh bk" style="left:380px;top:920px;width:34px;height:34px;"></div>
  <div class="bokeh soft bk" style="left:60px;top:760px;width:120px;height:120px;"></div>

  <div class="title" data-init="o:0,y:30">
    <div class="h2">產出 1・四種客群</div>
    <div class="sub">有風險的發言者，依說話方式分群</div>
  </div>
  <div id="intro" data-init="o:0,x:30">有風險的發言者 → 四種客群 <span class="tag demo">示意</span></div>

  <!-- 四個客群：圖示（計算機／反覆進廠的工單／擴音器／背影）-->
  <div class="persona panel p1" style="left:150px" data-base="perspective(1500px) rotateY(8deg)" data-init="o:0,y:40,s:.96">
    <div class="most">人數最多</div>
    <div class="stage">
      <div class="badge"><svg width="40" height="40" viewBox="0 0 40 40"><rect x="6" y="3" width="28" height="34" rx="5" fill="#2F5D9F"/><rect x="11" y="8" width="18" height="8" rx="2" fill="#DCE8F5"/><g fill="#DCE8F5"><rect x="11" y="20" width="5" height="5" rx="1"/><rect x="18" y="20" width="5" height="5" rx="1"/><rect x="25" y="20" width="5" height="5" rx="1"/><rect x="11" y="27" width="5" height="5" rx="1"/><rect x="18" y="27" width="5" height="5" rx="1"/><rect x="25" y="27" width="5" height="5" rx="1"/></g></svg></div>
      <div class="slab"></div><svg data-fig class="fig owner"></svg>
    </div>
    <div class="nm">過保精算派</div><div class="tr">保固一過就比價</div>
    <div class="cnt"><span class="n">0</span><small>人</small></div>
  </div>
  <div class="persona panel p2" style="left:520px" data-base="perspective(1500px) rotateY(4deg)" data-init="o:0,y:40,s:.96">
    <div class="stage">
      <div class="badge"><svg width="40" height="40" viewBox="0 0 40 40"><rect x="8" y="4" width="24" height="32" rx="4" fill="#fff" stroke="#2F5D9F" stroke-width="3"/><rect x="13" y="11" width="14" height="3" rx="1.5" fill="#2F5D9F"/><rect x="13" y="18" width="14" height="3" rx="1.5" fill="#9FC2E8"/><rect x="13" y="25" width="9" height="3" rx="1.5" fill="#9FC2E8"/><path d="M26 29 a6 6 0 1 1 6 -6" fill="none" stroke="#C0392B" stroke-width="2.5"/><path d="M32 20 l1 4 -4 -1z" fill="#C0392B"/></svg></div>
      <div class="slab"></div><svg data-fig class="fig owner"></svg>
    </div>
    <div class="nm">品質失望派</div><div class="tr">修不好就想換車</div>
    <div class="cnt"><span class="n">0</span><small>人</small></div>
  </div>
  <div class="persona panel p3" style="left:890px" data-base="perspective(1500px) rotateY(-4deg)" data-init="o:0,y:40,s:.96">
    <div class="stage">
      <div class="badge"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M6 16 h8 l14 -8 v24 l-14 -8 h-8z" fill="#2F5D9F"/><rect x="8" y="24" width="6" height="9" rx="2" fill="#44546A"/><path d="M31 14 a8 8 0 0 1 0 12 M34 10 a13 13 0 0 1 0 20" fill="none" stroke="#9FC2E8" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div class="slab"></div><svg data-fig class="fig owner"></svg>
    </div>
    <div class="nm">口碑建議者</div><div class="tr">自己走，還會帶別人走</div>
    <div class="cnt"><span class="n">0</span><small>人</small></div>
  </div>
  <div class="persona panel p4" style="left:1260px" data-base="perspective(1500px) rotateY(-8deg)" data-init="o:0,y:40,s:.96">
    <div class="stage">
      <div class="badge"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="11" r="7" fill="#44546A"/><path d="M9 36 v-9 a11 11 0 0 1 22 0 v9z" fill="#44546A"/><path d="M28 6 h8 M33 2 l4 4 -4 4" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="slab"></div><svg data-fig class="fig owner back"></svg>
    </div>
    <div class="nm">靜默出走者</div><div class="tr">從不抱怨，直接去了外廠</div>
    <div class="cnt"><span class="n">0</span><small>人</small></div>
  </div>

  <!-- 觀察名單 -->
  <div id="watch" class="panel tint" data-init="o:0,y:30">
    <svg data-fig class="fig grey"></svg>
    <div class="t">無法歸類 → 觀察名單<small>不貿然打擾・持續觀察，不投遞關懷訊息</small></div>
    <div class="cnt"><span id="nw">0</span><small>人</small></div>
  </div>
  <div id="stamp" data-init="o:0,s:1.8,r:-8">不投遞</div>
  <div class="foot note" data-init="o:0">人數為論壇公開資料的發言者分群結果（2007–2026/9），非真實名單・示意</div>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 21, lead: 0.3, in: 'sweep', out: 'sweep',
  keys: { k_intro: 0.1, k_p1: 3.75, k_p2: 6.94, k_p3: 9.35, k_p4: 11.89, k_watch: 15.33, k_nosend: 18.14 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys;
// 背影：把髮帽改成整頭深色（看不到臉的方向）
document.querySelector('.fig.back .hair').setAttribute('d', 'M30 30 a20 20 0 0 1 40 0 v8 a20 20 0 0 1 -40 0z');

Scene.tween('.title', 0.2, 0.9, { o: 1, y: 0 });
Scene.tween('#intro', K.k_intro + 0.3, 0.8, { o: 1, x: 0 });
const counts = [511, 247, 195, 128];
['.p1', '.p2', '.p3', '.p4'].forEach((sel, i) => {
  const at = K['k_p' + (i + 1)] - 0.2;
  Scene.tween(sel, at, 0.9, { o: 1, y: 0, s: 1 });
  Scene.float(sel, 4, 4.6 + i * 0.5, i * 1.3);
  Scene.tween(sel + ' svg.fig', at + 0.2, 0.9, { x: 0, o: 1 }, { from: { x: -70, o: 0 } });
});
Scene.tween('#watch', K.k_watch - 0.1, 0.9, { o: 1, y: 0 });
Scene.tween('#watch svg.fig', K.k_watch + 0.2, 1.2, { x: 0, o: 1 }, { from: { x: -120, o: 0 }, e: 'inout' });
Scene.tween('#stamp', K.k_nosend, 0.35, { o: 1, s: 1, r: -8 }, { e: 'in' });
Scene.tween('.foot', K.k_watch + 0.6, 0.8, { o: 1 });
Scene.float('.bk', 10, 6, 0);
Scene.hook(t => {
  counts.forEach((n, i) => {
    const el = document.querySelector('.p' + (i + 1) + ' .n');
    el.textContent = Scene.fmt(Math.round(n * Scene.prog(t, K['k_p' + (i + 1)] + 0.3, 1.2)));
  });
  document.getElementById('nw').textContent = Math.round(199 * Scene.prog(t, K.k_watch + 0.3, 1.0));
});
Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
