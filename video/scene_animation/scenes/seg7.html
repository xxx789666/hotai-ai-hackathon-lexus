<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 7 段：人工審核</title>
<link rel="stylesheet" href="common.css">
<style>
  .title { left: 120px; top: 90px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 8px; }
  #noauto { left: 820px; top: 100px; width: 540px; height: 84px; display: flex; align-items: center; gap: 14px; padding: 0 22px; box-sizing: border-box; font-size: 26px; font-weight: 700; color: var(--ink); }
  /* 專員 */
  #advisor { left: 120px; top: 300px; width: 300px; height: 300px; }
  /* 審核佇列 */
  #queue { left: 420px; top: 230px; width: 1120px; height: 600px; padding: 24px 28px; box-sizing: border-box; display: flex; gap: 24px; }
  #queue .list { width: 300px; flex: none; }
  #queue .list .hd { font-size: 24px; font-weight: 700; color: var(--ink); display: flex; justify-content: space-between; }
  #queue .item { margin-top: 12px; border-radius: 12px; background: var(--pale); padding: 12px 14px; height: 86px; box-sizing: border-box; }
  #queue .item.sel { background: #fff; box-shadow: 0 0 0 3px var(--blue); }
  #queue .item .t { font-size: 18px; color: var(--navy); font-weight: 700; display: flex; justify-content: space-between; }
  #queue .item .ln { height: 9px; border-radius: 5px; background: var(--light); margin-top: 10px; }
  #queue .main { flex: 1; position: relative; }
  #queue .main .hd { font-size: 24px; font-weight: 700; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
  #card { margin-top: 14px; background: #fff; border-radius: 14px; border: 2px solid var(--light); padding: 18px 20px; height: 300px; box-sizing: border-box; position: relative; }
  #card .dl { height: 40px; display: flex; align-items: center; gap: 10px; }
  #card .dl b { height: 13px; border-radius: 7px; background: var(--light); display: block; }
  #card .dl.edit b { background: #F7E2A8; }
  #card .dl.edit.done b { background: #CFE0F5; }
  #card .edtag { position: absolute; right: 18px; top: 92px; font-size: 18px; color: #B98800; font-weight: 700; }
  #btns { display: flex; gap: 18px; margin-top: 20px; }
  .btn { flex: 1; height: 76px; border-radius: 14px; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; }
  .btn.ok { background: var(--blue); color: #fff; } .btn.rw { background: #fff; color: #B98800; border: 3px solid var(--yellow); } .btn.rj { background: #EEF1F5; color: #6B7A90; }
  .btn.press { transform: scale(.94); filter: brightness(.92); }
  #cursor { width: 30px; height: 30px; border-radius: 50%; background: rgba(47,93,159,.25); border: 3px solid var(--blue); margin: -15px 0 0 -15px; }
  #approved { left: 1460px; top: 300px; width: 320px; height: 200px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #approved .t { font-size: 28px; font-weight: 700; color: var(--blue); }
  #approved small { font-size: 18px; color: #6B7A90; }
  #notes { left: 420px; top: 860px; font-size: 22px; color: var(--navy); }
</style>
</head>
<body>
<div id="stage">
  <div class="halo blue" style="left:-300px;top:-300px;width:1200px;height:1200px;"></div>
  <div class="halo white" style="left:1000px;top:400px;width:1100px;height:1100px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1550px;top:-300px;"></div>
  <div class="bokeh soft bk" style="left:1700px;top:850px;width:140px;height:140px;"></div>
  <div class="bokeh bk" style="left:200px;top:900px;width:34px;height:34px;"></div>

  <div class="title" data-init="o:0,y:30">
    <div class="h2">產出 2・人工審核</div>
    <div class="sub">草稿不會自動送出</div>
  </div>
  <div id="noauto" class="panel" data-init="o:0,y:-20">
    <svg width="44" height="44" viewBox="0 0 44 44"><path d="M6 12 h32 v22 h-32z" fill="#DCE8F5" stroke="#2F5D9F" stroke-width="3" rx="4"/><path d="M6 12 l16 13 16 -13" fill="none" stroke="#2F5D9F" stroke-width="3"/><circle cx="34" cy="32" r="10" fill="#fff" stroke="#C0392B" stroke-width="3"/><path d="M27 25 l14 14" stroke="#C0392B" stroke-width="3"/></svg>
    不自動送出・人工核准才投遞
  </div>

  <svg id="advisor" data-fig class="fig advisor" data-init="o:0,x:-40"></svg>

  <div id="queue" class="panel" data-base="perspective(1600px) rotateY(6deg)" data-init="o:0,y:40,s:.96">
    <div class="list">
      <div class="hd"><span>審核佇列</span><span class="tag demo">示意</span></div>
      <div class="item sel"><div class="t"><span>草稿 A</span><span>過保精算派</span></div><div class="ln"></div><div class="ln" style="width:70%"></div></div>
      <div class="item"><div class="t"><span>草稿 B</span><span>品質失望派</span></div><div class="ln"></div><div class="ln" style="width:60%"></div></div>
      <div class="item"><div class="t"><span>草稿 C</span><span>客訴回訪</span></div><div class="ln"></div><div class="ln" style="width:80%"></div></div>
      <div class="item"><div class="t"><span>草稿 D</span><span>觀察名單回訪</span></div><div class="ln"></div><div class="ln" style="width:55%"></div></div>
    </div>
    <div class="main">
      <div class="hd"><span>草稿 A・關懷訊息</span><span class="tag">引用：條款編號 ○○（示意）</span></div>
      <div id="card">
        <div class="dl"><b style="width:140px"></b><b style="width:320px"></b></div>
        <div class="dl edit l2"><b style="width:90px"></b><b style="width:380px"></b></div>
        <div class="dl"><b style="width:420px"></b><b style="width:100px"></b></div>
        <div class="dl"><b style="width:260px"></b></div>
        <div class="dl"><b style="width:360px"></b><b style="width:120px"></b></div>
        <div class="edtag" data-init="o:0">改寫一句 ✎</div>
      </div>
      <div id="btns">
        <div class="btn ok b-ok">核准</div><div class="btn rw b-rw">改寫</div><div class="btn rj b-rj">退回</div>
      </div>
    </div>
  </div>
  <div id="cursor" class="abs" data-init="o:0" style="left:0;top:0"></div>

  <div id="approved" class="panel tint" data-init="o:0,x:40,s:.9">
    <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#2F5D9F"/><path d="M18 33 l10 10 18 -22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="t">人工核准 → 投遞</div><small>只有核准的訊息才會送給車主</small>
  </div>
  <div id="notes" data-init="o:0">客訴回訪不計頻率上限；觀察名單車主也回訪 <span class="tag demo">示意</span></div>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 14, lead: 0.3, in: 'sweep', out: 'sweep',
  keys: { k_noauto: 0.1, k_queue: 2.77, k_buttons: 5.62, k_approve: 8.3 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys;
Scene.tween('.title', 0.2, 0.9, { o: 1, y: 0 });
Scene.tween('#noauto', K.k_noauto + 0.3, 0.8, { o: 1, y: 0 });
Scene.tween('#advisor', K.k_queue - 0.2, 0.8, { o: 1, x: 0 });
Scene.tween('#queue', K.k_queue - 0.1, 0.9, { o: 1, y: 0, s: 1 });
Scene.float('#queue', 3, 5.2, 0.4);
Scene.tween('#notes', K.k_queue + 1.0, 0.8, { o: 1 });
// 游標：改寫 → 改一句 → 核准
const posRW = { x: 1140, y: 660 }, posOK = { x: 890, y: 660 };
const tRW = K.k_buttons + 0.3, tOK = K.k_approve + 0.1;
Scene.tween('#cursor', K.k_buttons - 0.4, 0.5, { o: 1, x: 1000, y: 560 }, { from: { o: 0, x: 900, y: 480 } });
Scene.tween('#cursor', tRW - 0.5, 0.5, { x: posRW.x, y: posRW.y }, { e: 'inout' });
Scene.tween('#cursor', tOK - 0.6, 0.6, { x: posOK.x, y: posOK.y }, { e: 'inout' });
Scene.tween('#cursor', tOK + 0.6, 0.4, { o: 0 });
Scene.tween('.edtag', tRW + 0.2, 0.4, { o: 1 });
Scene.tween('#approved', tOK + 0.3, 0.7, { o: 1, x: 0, s: 1 }, { e: 'back' });
Scene.float('#approved', 3, 4.6, 1.1);
Scene.float('.bk', 10, 6, 0);
Scene.hook(t => {
  const rw = document.querySelector('.b-rw'), ok = document.querySelector('.b-ok');
  rw.classList.toggle('press', t >= tRW && t < tRW + 0.3);
  ok.classList.toggle('press', t >= tOK && t < tOK + 0.3);
  const l2 = document.querySelector('.l2');
  l2.classList.toggle('done', t >= tRW + 1.2);
  // 改寫後那句線條長度變化（示意改了一句）
  l2.children[1].style.width = (t >= tRW + 0.6 ? 300 : 380) + 'px';
  const card = document.getElementById('card');
  card.style.boxShadow = t >= tOK + 0.2 ? '0 0 0 4px rgba(47,93,159,.25)' : '';
});
Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
