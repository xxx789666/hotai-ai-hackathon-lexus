<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 0 段：人走了才知道</title>
<link rel="stylesheet" href="common.css">
<style>
  #dark { inset: 0; background: radial-gradient(ellipse at 50% 60%, #16305A 0%, #0F1F3D 60%, #0A162C 100%); z-index: 40; }
  #dark svg { position: absolute; inset: 0; }
  #darkhalo { left: 960px; top: 560px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; z-index: 41; }
  .title { left: 120px; top: 96px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 10px; font-weight: 400; letter-spacing: 1px; }
  /* 辦公室面板 */
  #office { left: 120px; top: 300px; width: 640px; height: 470px; }
  #office svg { position: absolute; left: 0; top: 0; }
  /* 月報卡 */
  #report { left: 830px; top: 270px; width: 520px; height: 500px; padding: 28px 34px; box-sizing: border-box; }
  #report .rt { display: flex; align-items: baseline; justify-content: space-between; }
  #report .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; margin-top: 22px; }
  #report .grid svg { width: 86px; height: 86px; display: block; margin: 0 auto; }
  #report .bar { position: absolute; left: 34px; right: 34px; bottom: 30px; height: 12px; border-radius: 6px; background: var(--light); overflow: hidden; }
  #report .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--blue); border-radius: 6px; transform-origin: left; }
  /* 走向外廠的灰色車主 */
  .ghost { width: 86px; height: 86px; }
  /* 一般外廠招牌 */
  #sign { left: 1500px; top: 720px; width: 300px; height: 140px; }
  #sign .board { position: absolute; left: 0; top: 0; width: 300px; height: 92px; border-radius: 14px; background: linear-gradient(135deg, #D7DEE7 0%, #BFC9D6 100%);
    color: #44546A; font-size: 34px; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: 3px; box-shadow: 0 14px 30px rgba(68,84,106,.18); }
  #sign .pole { position: absolute; left: 140px; top: 92px; width: 20px; height: 48px; background: #BFC9D6; border-radius: 0 0 6px 6px; }
  #sign .tag { position: absolute; right: -8px; top: -16px; }
  /* 六分之一卡 */
  #six { left: 1390px; top: 250px; width: 430px; height: 430px; padding: 28px 30px; box-sizing: border-box; }
  #six .lead { font-size: 26px; color: var(--navy); font-weight: 500; }
  #six .ratio { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
  #six .ratio .one { font-size: 132px; font-weight: 700; color: var(--red); line-height: 1; }
  #six .ratio .slash { font-size: 64px; color: var(--grey); font-weight: 300; }
  #six .ratio .sixn { font-size: 96px; font-weight: 700; color: var(--blue); line-height: 1; }
  #six .row { display: flex; gap: 8px; margin-top: 18px; }
  #six .row svg { width: 52px; height: 52px; }
  #six .msg { font-size: 30px; font-weight: 700; color: var(--ink); margin-top: 14px; }
  #six .note { margin-top: 10px; }
</style>
</head>
<body>
<div id="stage">
  <!-- 背景柔光、斜向光束、散景 -->
  <div class="halo blue" style="left:1250px;top:-250px;width:1200px;height:1200px;"></div>
  <div class="halo white" style="left:-200px;top:500px;width:1000px;height:1000px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1180px;top:-300px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1480px;top:-300px;opacity:.35"></div>
  <div class="bokeh soft bk" style="left:300px;top:160px;width:120px;height:120px;"></div>
  <div class="bokeh bk" style="left:980px;top:880px;width:40px;height:40px;"></div>
  <div class="bokeh soft bk" style="left:1700px;top:820px;width:160px;height:160px;"></div>
  <div class="bokeh bk" style="left:760px;top:120px;width:26px;height:26px;"></div>
  <div class="bokeh bk" style="left:1390px;top:160px;width:34px;height:34px;"></div>

  <!-- 標題 -->
  <div class="title" data-init="o:0,y:30">
    <div class="h1">人走了才知道</div>
    <div class="sub">售後服務部門・每月回廠報表<span class="tag demo" style="margin-left:14px">示意</span></div>
  </div>

  <!-- 辦公室：經理看月報（無五官人形）-->
  <div id="office" class="panel tint" data-base="perspective(1500px) rotateY(12deg) rotateX(3deg)" data-init="o:0,y:40,s:.96">
    <svg width="640" height="470" viewBox="0 0 640 470">
      <!-- 牆面與窗 -->
      <rect x="40" y="36" width="230" height="150" rx="12" fill="#DCE8F5"/>
      <rect x="54" y="50" width="98" height="122" rx="6" fill="#EEF4FB"/>
      <rect x="160" y="50" width="96" height="122" rx="6" fill="#EEF4FB"/>
      <!-- 盆栽 -->
      <rect x="560" y="300" width="44" height="60" rx="8" fill="#9FC2E8"/>
      <ellipse cx="582" cy="290" rx="40" ry="34" fill="#7FA6D6"/>
      <!-- 經理（坐姿，無五官）-->
      <g class="fig manager" transform="translate(230,110) scale(1.25)">
        <path class="cloth" d="M50 120 h120 a30 30 0 0 1 30 30 v70 h-180 v-70 a30 30 0 0 1 30 -30z"/>
        <path class="shirt" d="M96 120 h28 l-14 60z"/>
        <circle class="skin" cx="110" cy="80" r="44"/>
        <path class="hair" d="M66 74 a44 44 0 0 1 88 0 v10 a44 44 0 0 1 -88 0z"/>
      </g>
      <!-- 桌子與螢幕 -->
      <rect x="60" y="330" width="520" height="26" rx="10" fill="#C7DBF1"/>
      <rect x="90" y="356" width="24" height="80" rx="6" fill="#DCE8F5"/>
      <rect x="520" y="356" width="24" height="80" rx="6" fill="#DCE8F5"/>
      <rect x="190" y="236" width="150" height="96" rx="10" fill="#44546A"/>
      <rect x="200" y="246" width="130" height="76" rx="6" fill="#2F5D9F"/>
      <rect x="210" y="256" width="60" height="8" rx="4" fill="#9FC2E8"/>
      <rect x="210" y="272" width="90" height="8" rx="4" fill="#DCE8F5"/>
      <rect x="210" y="288" width="40" height="8" rx="4" fill="#DCE8F5"/>
      <rect x="250" y="332" width="30" height="12" rx="3" fill="#C7DBF1"/>
      <!-- 手上的報表 -->
      <g id="paper" transform="translate(380,250) rotate(-8)">
        <rect x="0" y="0" width="110" height="90" rx="6" fill="#fff" stroke="#DCE8F5" stroke-width="3"/>
        <rect x="14" y="16" width="60" height="8" rx="4" fill="#2F5D9F"/>
        <rect x="14" y="34" width="80" height="6" rx="3" fill="#DCE8F5"/>
        <rect x="14" y="48" width="70" height="6" rx="3" fill="#DCE8F5"/>
        <rect x="14" y="62" width="50" height="6" rx="3" fill="#C0392B" opacity=".7"/>
      </g>
    </svg>
  </div>

  <!-- 月報卡：回廠車主圖示 -->
  <div id="report" class="panel" data-base="perspective(1500px) rotateY(-8deg)" data-init="o:0,y:40,s:.96">
    <div class="rt"><div class="h2">月報・回廠車主</div><span class="tag demo">示意</span></div>
    <div class="note" style="margin-top:4px">本月回廠狀況（圖示為示意，非真實名單）</div>
    <div class="grid">
      <svg data-fig class="fig owner o1"></svg><svg data-fig class="fig owner o2"></svg><svg data-fig class="fig owner o3"></svg><svg data-fig class="fig owner o4"></svg>
      <svg data-fig class="fig owner o5"></svg><svg data-fig class="fig owner o6"></svg><svg data-fig class="fig owner o7"></svg><svg data-fig class="fig owner o8"></svg>
      <svg data-fig class="fig owner o9"></svg><svg data-fig class="fig owner o10"></svg><svg data-fig class="fig owner o11"></svg><svg data-fig class="fig owner o12"></svg>
    </div>
    <div class="bar"><i id="rbar"></i></div>
  </div>
  <!-- 走出去的灰色車主（從月報卡走到招牌）-->
  <svg data-fig class="fig grey ghost g1" data-init="o:0" style="left:1208px;top:510px"></svg>
  <svg data-fig class="fig grey ghost g2" data-init="o:0" style="left:1208px;top:610px"></svg>
  <svg data-fig class="fig grey ghost g3" data-init="o:0" style="left:1078px;top:610px"></svg>

  <!-- 一般外廠招牌 -->
  <div id="sign" data-init="o:0,y:30">
    <div class="board">一般外廠</div><div class="pole"></div><span class="tag demo">示意</span>
  </div>

  <!-- 每 6 位有 1 位在找出口 -->
  <div id="six" class="panel" data-base="perspective(1500px) rotateY(-10deg)" data-init="o:0,x:60,s:.96">
    <div class="lead">公開論壇上的售後發言者</div>
    <div class="ratio"><span class="one" id="one">1</span><span class="slash">/</span><span class="sixn">6</span></div>
    <div class="row">
      <svg data-fig class="fig red s1"></svg><svg data-fig class="fig owner s2"></svg><svg data-fig class="fig owner s3"></svg>
      <svg data-fig class="fig owner s4"></svg><svg data-fig class="fig owner s5"></svg><svg data-fig class="fig owner s6"></svg>
    </div>
    <div class="msg" id="sixmsg" data-init="o:0,y:10">每 6 位，有 1 位在找出口</div>
    <div class="note">論壇公開資料 2007–2026/9・高風險 1,049 ÷ 發言者 6,394・示意</div>
  </div>

  <!-- 深色粒子開場（看不見 → 看見）-->
  <div id="dark"><svg id="particles" width="1920" height="1080"></svg></div>
  <div id="darkhalo" class="halo white" data-init="o:0,s:.1"></div>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 20, lead: 2.4, in: 'none', out: 'sweep', dout: 0.6,
  keys: { k_report: 2.67, k_leave: 6.25, k_forum: 9.29, k_six: 13.29 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys, L = S.lead;

// --- 粒子（決定論）---
const R = Scene.rng(41);
const parts = Array.from({ length: 160 }, (_, i) => ({ x: R() * 1920, y: R() * 1080, r: 1.5 + R() * 3.5, v: 8 + R() * 22, ph: R() * 6.28, tw: 0.6 + R() * 1.4 }));
const svg = document.getElementById('particles');
svg.innerHTML = parts.map(() => '<circle fill="#DCE8F5"/>').join('');
const circles = [...svg.children];
Scene.hook(t => {
  const dark = document.getElementById('dark');
  // 深色幕：lead-1.1 起 1.3 秒內變亮淡出
  const fade = Scene.prog(t, L - 1.1, 1.3, 'inout');
  dark.style.opacity = 1 - fade;
  if (fade >= 1) { dark.style.display = 'none'; return; }
  dark.style.display = 'block';
  circles.forEach((c, i) => {
    const p = parts[i];
    const y = ((p.y - t * p.v) % 1080 + 1080) % 1080;
    const x = p.x + Math.sin(t * 0.6 + p.ph) * 12;
    const o = 0.25 + 0.75 * Math.abs(Math.sin(t * p.tw + p.ph));
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', p.r); c.setAttribute('opacity', o * (0.7 + 0.3 * Scene.prog(t, 0, 1.2)));
  });
});
// 中央白光暈：由小變大蓋過深色（象徵看見）
Scene.tween('#darkhalo', L - 1.5, 1.8, { o: 1, s: 1.6 }, { e: 'inout' });
Scene.tween('#darkhalo', L + 0.4, 1.2, { o: 0, s: 2.2 });

// --- 進場 ---
Scene.tween('.title', L + 0.1, 0.9, { o: 1, y: 0 });
Scene.tween('#office', L + 0.3, 1.0, { o: 1, y: 0, s: 1 });
Scene.float('#office', 5, 5.2, 0.3);
Scene.tween('#report', K.k_report - 0.3, 0.9, { o: 1, y: 0, s: 1 });
Scene.float('#report', 5, 4.6, 1.4);
Scene.tween('#rbar', K.k_report + 0.4, 1.4, { sx: 0.66 }, { from: { sx: 0 } });

// 車主變灰、走向一般外廠
Scene.tween('#sign', K.k_leave - 0.2, 0.8, { o: 1, y: 0 });
Scene.float('#sign', 3, 4.8, 2.1);
const leaveDelay = [0, 0.55, 1.1];
['.o8', '.o12', '.o11'].forEach((sel, i) => {
  Scene.tween(sel, K.k_leave + leaveDelay[i], 0.5, { o: 0.25 });
});
['.g1', '.g2', '.g3'].forEach((sel, i) => {
  const at = K.k_leave + leaveDelay[i] + 0.15;
  Scene.tween(sel, at, 0.2, { o: 1 }, { from: { o: 0, x: 0, y: 0 } });
  const el = document.querySelector(sel);
  const dx = 1580 - parseFloat(el.style.left) + (i - 1) * 18, dy = 630 - parseFloat(el.style.top);
  Scene.tween(sel, at + 0.1, 1.6, { x: dx, y: dy, s: 0.8 }, { e: 'inout' });
  Scene.tween(sel, at + 1.6, 0.5, { o: 0 });
});
// 以 class 變灰（透明度之外再把顏色換掉）
Scene.hook(t => {
  ['.o8', '.o12', '.o11'].forEach((sel, i) => {
    const el = document.querySelector(sel);
    el.classList.toggle('grey', t >= K.k_leave + leaveDelay[i] + 0.25);
  });
  // 六位中的紅色那位：k_six 時脈動
  const s1 = document.querySelector('.s1');
  const pul = t >= K.k_six ? 1 + 0.08 * Math.max(0, Math.sin((t - K.k_six) * 5)) : 1;
  s1.style.transform = `scale(${pul})`;
  const one = document.getElementById('one');
  one.style.textShadow = t >= K.k_six ? `0 0 ${18 + 10 * Math.sin((t - K.k_six) * 4)}px rgba(192,57,43,.45)` : 'none';
});
// 每 6 位有 1 位
Scene.tween('#six', K.k_forum - 0.2, 0.9, { o: 1, x: 0, s: 1 });
Scene.float('#six', 4, 5.0, 2.6);
Scene.tween('#sixmsg', K.k_six - 0.1, 0.6, { o: 1, y: 0 });
// 散景緩慢漂浮
Scene.float('.bk', 10, 6, 0);

Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
