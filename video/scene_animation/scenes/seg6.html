<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 6 段：AI 生成內容與條款查核</title>
<link rel="stylesheet" href="common.css">
<style>
  .title { left: 120px; top: 90px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 8px; }
  /* 訊息草稿 */
  #draft { left: 150px; top: 240px; width: 760px; height: 600px; padding: 26px 32px; box-sizing: border-box; }
  #draft .hd { display: flex; align-items: center; gap: 12px; }
  #draft .hd .tag { font-size: 20px; }
  #draft .hd .ti { font-size: 26px; font-weight: 700; color: var(--ink); margin-left: auto; }
  #draft .body { margin-top: 22px; }
  .dl { display: flex; align-items: center; gap: 10px; height: 44px; }
  .dl b { height: 14px; border-radius: 7px; background: var(--light); display: block; }
  .num { display: inline-flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 700; color: var(--blue); background: var(--pale); border: 2px solid var(--sky); border-radius: 10px; padding: 3px 12px; position: relative; }
  .num .ck { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.4); }
  .num.ok .ck { opacity: 1; transform: scale(1); }
  .num.ok { box-shadow: 0 0 0 4px rgba(47,93,159,.15); }
  .num.ref::after { content: attr(data-ref); position: absolute; left: 0; top: -26px; font-size: 15px; color: #6B7A90; white-space: nowrap; font-weight: 400; opacity: var(--refo, 0); }
  #pricerow { margin-top: 16px; display: flex; align-items: center; gap: 14px; font-size: 24px; color: var(--navy); }
  #pricerow .fld { border: 2px dashed var(--grey); border-radius: 10px; padding: 6px 14px; color: #8A96A8; position: relative; }
  #pricerow .no { font-size: 22px; font-weight: 700; color: var(--red); border: 2px solid var(--red); border-radius: 999px; padding: 4px 14px; background: rgba(255,255,255,.9); }
  #draft .foot2 { position: absolute; left: 32px; right: 32px; bottom: 20px; font-size: 18px; color: #6B7A90; }
  /* 書架 */
  #shelf { left: 1000px; top: 240px; width: 820px; height: 600px; padding: 26px 30px; box-sizing: border-box; }
  #shelf .hd { display: flex; justify-content: space-between; align-items: baseline; }
  #shelf .big { font-size: 96px; }
  #shelf .big small { font-size: 32px; color: var(--navy); margin-left: 8px; letter-spacing: 0; }
  .row76 { margin-top: 10px; }
  .row76 .lb { font-size: 24px; font-weight: 700; color: var(--navy); display: flex; justify-content: space-between; }
  .row76 .books { display: flex; gap: 4px; margin-top: 8px; height: 56px; align-items: flex-end; border-bottom: 6px solid #C7DBF1; padding-bottom: 4px; }
  .row76 .books i { display: block; width: 12px; border-radius: 3px 3px 0 0; background: var(--blue); height: 44px; transform-origin: bottom; }
  .row76.manual .books i { background: var(--navy); height: 50px; }
  .row76 .books i:nth-child(3n) { height: 38px; } .row76 .books i:nth-child(5n) { height: 52px; }
  #links { left: 0; top: 0; }
  #links path { fill: none; stroke: var(--sky); stroke-width: 3; stroke-dasharray: 8 8; }
</style>
</head>
<body>
<div id="stage">
  <div class="halo blue" style="left:1100px;top:-350px;width:1300px;height:1300px;"></div>
  <div class="halo white" style="left:-300px;top:400px;width:1100px;height:1100px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:850px;top:-300px;"></div>
  <div class="bokeh soft bk" style="left:60px;top:880px;width:120px;height:120px;"></div>
  <div class="bokeh bk" style="left:1500px;top:900px;width:34px;height:34px;"></div>

  <div class="title" data-init="o:0,y:30">
    <div class="h2">產出 2・AI 生成內容與條款查核</div>
    <div class="sub">只引用官方條款，數字逐字比對</div>
  </div>

  <!-- 草稿 -->
  <div id="draft" class="panel" data-base="perspective(1500px) rotateY(8deg)" data-init="o:0,y:40,s:.96">
    <div class="hd"><span class="tag">客群：過保精算派</span><span class="tag">時機：保固到期前 60 天</span><span class="tag demo">示意</span><span class="ti">關懷訊息草稿</span></div>
    <div class="body">
      <div class="dl"><b style="width:120px"></b><b style="width:300px"></b></div>
      <div class="dl"><b style="width:90px"></b><span class="num n1" data-ref="引用：條款編號 ○○（示意）"><span>60 天</span><span class="ck">✓</span></span><b style="width:260px"></b></div>
      <div class="dl"><b style="width:420px"></b><b style="width:110px"></b></div>
      <div class="dl"><b style="width:160px"></b><span class="num n2" data-ref="引用：條款編號 ○○（示意）"><span>7 天</span><span class="ck">✓</span></span><b style="width:200px"></b></div>
      <div class="dl"><b style="width:380px"></b></div>
      <div id="pricerow"><span>定保價格</span><span class="fld">（未填）</span><span class="no" data-init="o:0,s:.6">無條款，不寫入</span></div>
    </div>
    <div class="foot2">每個數字都與條款原文逐字比對；官方未公開的價格不會出現在訊息裡。草稿內容為示意，非真實訊息。</div>
  </div>

  <!-- 條款書架 -->
  <div id="shelf" class="panel tint" data-base="perspective(1500px) rotateY(-10deg)" data-init="o:0,x:60,s:.96">
    <div class="hd"><div class="h2">官方條款</div><span class="tag demo">示意</span></div>
    <div class="big"><span id="n76">0</span><small>條</small></div>
    <div class="row76 web"><div class="lb"><span>官網</span><span>40 條</span></div><div class="books" id="bw"></div></div>
    <div class="row76 manual"><div class="lb"><span>手冊</span><span>36 條</span></div><div class="books" id="bm"></div></div>
  </div>
  <svg id="links" width="1920" height="1080" data-init="o:0">
    <path d="M 420 400 C 700 400, 800 520, 1040 520"/>
    <path d="M 440 490 C 700 490, 800 640, 1040 640"/>
  </svg>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 16, lead: 0.3, in: 'sweep', out: 'sweep',
  keys: { k_draft: 0.1, k_76: 4.29, k_check: 6.97, k_price: 10.18, k_ref: 0 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys;
document.getElementById('bw').innerHTML = '<i></i>'.repeat(40);
document.getElementById('bm').innerHTML = '<i></i>'.repeat(36);

Scene.tween('.title', 0.2, 0.9, { o: 1, y: 0 });
Scene.tween('#draft', K.k_draft + 0.2, 0.9, { o: 1, y: 0, s: 1 });
Scene.float('#draft', 3, 5, 0.3);
Scene.tween('#shelf', K.k_76 - 0.2, 0.9, { o: 1, x: 0, s: 1 });
Scene.float('#shelf', 3, 5.4, 1.6);
Scene.tween('#bw i', K.k_76 + 0.3, 0.3, { sy: 1 }, { from: { sy: 0 }, stagger: 0.02 });
Scene.tween('#bm i', K.k_76 + 0.8, 0.3, { sy: 1 }, { from: { sy: 0 }, stagger: 0.02 });
Scene.tween('#links', K.k_check - 0.1, 0.6, { o: 1 });
Scene.tween('#links', K.k_check + 2.2, 0.6, { o: 0 });
Scene.tween('#pricerow .no', K.k_price + 0.2, 0.4, { o: 1, s: 1 }, { e: 'back' });
Scene.float('.bk', 10, 6, 0);
Scene.hook(t => {
  document.getElementById('n76').textContent = Math.round(76 * Scene.prog(t, K.k_76, 1.2));
  document.querySelector('.n1').classList.toggle('ok', t >= K.k_check + 0.6);
  document.querySelector('.n2').classList.toggle('ok', t >= K.k_check + 1.3);
  // 引用編號（原旁白句已刪，改由畫面呈現）
  const ro = Scene.prog(t, K.k_check + 1.8, 0.6);
  document.querySelectorAll('.num').forEach(el => { el.classList.add('ref'); el.style.setProperty('--refo', ro); });
  // 草稿打字：內容線條依序出現
  document.querySelectorAll('#draft .dl').forEach((el, i) => { el.style.opacity = Scene.prog(t, K.k_draft + 0.8 + i * 0.35, 0.4); });
});
Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
