<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 4 段：風險分級與經理的看板</title>
<link rel="stylesheet" href="common.css">
<style>
  .title { left: 120px; top: 90px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 8px; }
  /* 左：發言者與風險分 */
  #person { left: 330px; top: 520px; width: 240px; height: 240px; }
  #score { left: 280px; top: 330px; width: 340px; height: 150px; padding: 18px 24px; box-sizing: border-box; text-align: center; }
  #score .lbl { font-size: 22px; color: var(--navy); }
  #score .v { font-size: 64px; font-weight: 700; color: var(--blue); line-height: 1.1; font-variant-numeric: tabular-nums; }
  #score .v small { font-size: 22px; color: #6B7A90; margin-left: 8px; font-weight: 400; }
  .chip { width: 300px; height: 90px; padding: 0 22px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; color: var(--ink); }
  .chip small { display: block; font-size: 17px; color: #6B7A90; font-weight: 400; }
  #chipA { left: 60px; top: 200px; } #chipB { left: 60px; top: 760px; }
  #merge { left: 0; top: 0; }
  #merge path { fill: none; stroke-linecap: round; }
  #merge .g { stroke: #BFD8F3; stroke-width: 26; filter: blur(8px); opacity: .9; }
  #merge .c { stroke: #fff; stroke-width: 8; }
  /* 中：三級 */
  .lvl { left: 760px; width: 480px; height: 150px; padding: 18px 26px; box-sizing: border-box; display: flex; align-items: center; gap: 18px; border-left: 12px solid; }
  .lvl .nm { font-size: 34px; font-weight: 700; width: 70px; }
  .lvl .n { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .lvl .n small { font-size: 22px; margin-left: 4px; color: var(--navy); font-weight: 400; }
  .lvl .ex { margin-left: auto; font-size: 20px; color: var(--navy); text-align: right; line-height: 1.3; }
  .lvl .ex b { display: block; font-size: 30px; }
  #hi { top: 250px; border-color: var(--red); } #hi .nm, #hi .n, #hi .ex b { color: var(--red); }
  #mid { top: 430px; border-color: var(--yellow); } #mid .nm, #mid .n { color: #B98800; }
  #lo { top: 610px; border-color: var(--blue); } #lo .nm, #lo .n, #lo .ex b { color: var(--blue); }
  .lvl .dots { display: flex; gap: 4px; flex-wrap: wrap; width: 110px; }
  .lvl .dots i { width: 12px; height: 12px; border-radius: 50%; background: currentColor; opacity: .5; }
  /* 右：經理的看板 */
  #screen { left: 1300px; top: 230px; width: 520px; height: 560px; padding: 22px 24px; box-sizing: border-box; }
  #screen .hd { display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 700; color: #fff; }
  #screen .lamp { width: 22px; height: 22px; border-radius: 50%; background: #C0392B; box-shadow: 0 0 0 0 rgba(192,57,43,.6); }
  #screen .boards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 18px; }
  #screen .bd { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 10px; height: 200px; box-sizing: border-box; }
  #screen .bd .t { font-size: 18px; font-weight: 700; color: #fff; }
  #screen .bd .ln { height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); margin-top: 10px; }
  #screen .bd .bar { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin-top: 12px; }
  #screen .bd .bar i { flex: 1; background: #9FC2E8; border-radius: 3px 3px 0 0; }
  #screen .reports { margin-top: 18px; display: flex; gap: 12px; }
  #screen .rp { flex: 1; background: #fff; border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 18px; font-weight: 700; position: relative; overflow: hidden; height: 110px; box-sizing: border-box; }
  #screen .rp .pg { position: absolute; left: 12px; right: 12px; top: 40px; }
  #screen .rp .pg .ln { height: 7px; border-radius: 4px; background: var(--light); margin-top: 8px; }
  #screen .up { margin-top: 14px; font-size: 18px; color: #DCE8F5; display: flex; justify-content: space-between; }
  .foot { left: 150px; top: 920px; }
</style>
</head>
<body>
<div id="stage">
  <div class="halo blue" style="left:1000px;top:-400px;width:1300px;height:1300px;"></div>
  <div class="halo white" style="left:-300px;top:300px;width:1100px;height:1100px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1100px;top:-300px;"></div>
  <div class="bokeh soft bk" style="left:1750px;top:850px;width:140px;height:140px;"></div>
  <div class="bokeh bk" style="left:700px;top:900px;width:34px;height:34px;"></div>

  <div class="title" data-init="o:0,y:30">
    <div class="h2">產出 1・風險分級與經理的看板</div>
    <div class="sub">風險分＝模型判斷 ×0.6 ＋ 八條規則 ÷8 ×0.4</div>
  </div>

  <!-- 兩股光線合成風險分 -->
  <svg id="merge" width="1920" height="1080" data-init="o:0">
    <path class="g" d="M 360 245 C 520 245, 420 380, 450 400"/>
    <path class="g" d="M 360 805 C 520 805, 420 520, 450 500"/>
    <path class="c" d="M 360 245 C 520 245, 420 380, 450 400"/>
    <path class="c" d="M 360 805 C 520 805, 420 520, 450 500"/>
  </svg>
  <div id="chipA" class="chip panel" data-init="o:0,x:-40"><svg width="44" height="44" viewBox="0 0 44 44"><rect x="6" y="6" width="32" height="32" rx="8" fill="#2F5D9F"/><rect x="14" y="14" width="16" height="16" rx="3" fill="#DCE8F5"/></svg><div>模型判斷<small>本機模型的流失機率 ×0.6</small></div></div>
  <div id="chipB" class="chip panel" data-init="o:0,x:-40"><svg width="44" height="44" viewBox="0 0 44 44"><rect x="8" y="5" width="28" height="34" rx="4" fill="#fff" stroke="#2F5D9F" stroke-width="3"/><g fill="#2F5D9F"><rect x="13" y="12" width="18" height="3" rx="1.5"/><rect x="13" y="19" width="18" height="3" rx="1.5"/><rect x="13" y="26" width="12" height="3" rx="1.5"/></g></svg><div>八條規則<small>符合條數 ÷8 ×0.4</small></div></div>
  <svg id="person" data-fig class="fig owner" data-init="o:0,y:30"></svg>
  <div id="score" class="panel" data-init="o:0,y:20,s:.9">
    <div class="lbl">風險分 <span class="tag demo">示意</span></div>
    <div class="v"><span id="sv">0.00</span><small>0–1</small></div>
  </div>

  <!-- 三級 -->
  <div id="hi" class="lvl panel" data-init="o:0,x:40"><div class="nm">高</div><div class="dots"></div><div class="n"><span class="cn">0</span><small>人</small></div><div class="ex" data-init="o:0"><b>74.1%</b>確實說過流失句</div></div>
  <div id="mid" class="lvl panel" data-init="o:0,x:40"><div class="nm">中</div><div class="dots"></div><div class="n"><span class="cn">0</span><small>人</small></div></div>
  <div id="lo" class="lvl panel" data-init="o:0,x:40"><div class="nm">低</div><div class="dots"></div><div class="n"><span class="cn">0</span><small>人</small></div><div class="ex" data-init="o:0"><b>1.8%</b>說過流失句</div></div>

  <!-- 經理的看板 -->
  <div id="screen" class="panel deep" data-base="perspective(1500px) rotateY(-10deg)" data-init="o:0,x:60,s:.96">
    <div class="hd"><span>經理的看板 <span class="tag demo" style="color:#DCE8F5;border-color:#9FC2E8;background:transparent">示意</span></span><span class="lamp" id="lamp"></span></div>
    <div class="boards">
      <div class="bd"><div class="t">戰情總覽</div><div class="bar"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:35%"></i></div><div class="ln"></div><div class="ln" style="width:60%"></div></div>
      <div class="bd"><div class="t">報告池</div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:65%"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:50%"></div></div>
      <div class="bd"><div class="t">原始輿情</div><div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="ln"></div><div class="ln" style="width:55%"></div><div class="ln" style="width:75%"></div></div>
    </div>
    <div class="reports">
      <div class="rp">日報<div class="pg pgA"><div class="ln"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:85%"></div></div></div>
      <div class="rp">週報<div class="pg pgB"><div class="ln"></div><div class="ln" style="width:60%"></div><div class="ln" style="width:80%"></div></div></div>
      <div class="rp">季報<div class="pg pgC"><div class="ln"></div><div class="ln" style="width:75%"></div><div class="ln" style="width:55%"></div></div></div>
    </div>
    <div class="up"><span>每天自動更新</span><span id="upd">—</span></div>
  </div>
  <div class="foot note" data-init="o:0">高 1,049・中 231・低 5,114 位發言者；高風險中 74.1%、低風險中 1.8% 說過流失句（論壇公開資料 2007–2026/9）・示意</div>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 22, lead: 0.3, in: 'sweep', out: 'glow',
  keys: { k_score: 0.1, k_merge: 2.87, k_levels: 6.19, k_high: 9.15, k_75: 11.78, k_low: 14.84, k_board: 17.9 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys;
document.querySelectorAll('.lvl .dots').forEach((d, i) => { d.innerHTML = '<i></i>'.repeat([20, 6, 28][i]); });

Scene.tween('.title', 0.2, 0.9, { o: 1, y: 0 });
Scene.tween('#person', K.k_score + 0.1, 0.8, { o: 1, y: 0 });
Scene.tween('#score', K.k_score + 0.5, 0.8, { o: 1, y: 0, s: 1 }, { e: 'back' });
Scene.float('#score', 4, 4.4, 0.2);
Scene.tween('#chipA', K.k_merge - 0.1, 0.7, { o: 1, x: 0 });
Scene.tween('#chipB', K.k_merge + 0.5, 0.7, { o: 1, x: 0 });
Scene.tween('#merge', K.k_merge + 0.3, 1.0, { o: 1 });
['#hi', '#mid', '#lo'].forEach((s, i) => { Scene.tween(s, K.k_levels - 0.1 + i * 0.3, 0.7, { o: 1, x: 0 }); Scene.float(s, 3, 4.8 + i * 0.4, i); });
Scene.tween('#hi .ex', K.k_75 - 0.1, 0.6, { o: 1 });
Scene.tween('#lo .ex', K.k_low + 0.2, 0.6, { o: 1 });
Scene.tween('#screen', K.k_board - 0.3, 0.9, { o: 1, x: 0, s: 1 });
Scene.float('#screen', 4, 5.2, 2);
Scene.tween('.foot', K.k_levels + 1.0, 0.8, { o: 1 });
Scene.float('.bk', 10, 6, 0);

const counts = { hi: 1049, mid: 231, lo: 5114 };
Scene.hook(t => {
  // 風險分跳動後定在示意值
  const p = Scene.prog(t, K.k_score + 0.6, 1.4);
  const v = p < 1 ? (0.5 + 0.5 * Math.sin(t * 17)) * p : 0.82;
  document.getElementById('sv').textContent = v.toFixed(2);
  // 高中低人數
  ['hi', 'mid', 'lo'].forEach((k, i) => {
    document.querySelector('#' + k + ' .cn').textContent = Scene.fmt(Math.round(counts[k] * Scene.prog(t, K.k_levels + 0.4 + i * 0.3, 1.2)));
  });
  // 高風險強調
  document.getElementById('hi').style.boxShadow = t >= K.k_high ? '0 0 0 3px rgba(192,57,43,.35), 0 24px 60px rgba(192,57,43,.18)' : '';
  // 看板：報告翻頁、預警燈、更新日
  const flip = (t - K.k_board) * 1.2;
  ['pgA', 'pgB', 'pgC'].forEach((c, i) => {
    const el = document.querySelector('.' + c);
    const ph = ((flip + i * 0.33) % 1 + 1) % 1;
    el.style.transform = `translateY(${(ph < 0.15 ? -40 * (1 - ph / 0.15) : 0)}px)`;
    el.style.opacity = ph < 0.15 ? ph / 0.15 : 1;
  });
  const lamp = document.getElementById('lamp');
  const blink = t >= K.k_board + 0.6 ? 0.5 + 0.5 * Math.sin((t - K.k_board) * 6) : 0.3;
  lamp.style.boxShadow = `0 0 ${10 + 14 * blink}px ${4 * blink}px rgba(192,57,43,${0.3 + 0.4 * blink})`;
  lamp.style.opacity = 0.6 + 0.4 * blink;
  document.getElementById('upd').textContent = t >= K.k_board + 0.3 ? '今日 ' + ['08:00', '08:00', '08:00', '08:01'][Math.floor(flip) % 4] : '—';
});
Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
