<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 5 段：接觸點與時機</title>
<link rel="stylesheet" href="common.css">
<style>
  .title { left: 120px; top: 90px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 8px; }
  #lead { left: 760px; top: 108px; font-size: 32px; font-weight: 700; color: var(--ink); }
  /* 服務廠櫃檯 */
  #counter { left: 120px; top: 300px; width: 460px; height: 430px; }
  #counter svg { position: absolute; left: 0; top: 0; }
  #listcard { left: 560px; top: 250px; width: 300px; height: 230px; padding: 18px 22px; box-sizing: border-box; }
  #listcard .t { font-size: 22px; font-weight: 700; color: var(--ink); display: flex; justify-content: space-between; }
  #listcard .rowx { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  #listcard .rowx i { width: 14px; height: 14px; border-radius: 50%; }
  #listcard .rowx b { height: 10px; border-radius: 5px; background: var(--light); flex: 1; }
  #listcard .rowx span { font-size: 15px; color: #6B7A90; width: 80px; text-align: right; }
  /* 時間軸 */
  #tl { left: 760px; top: 300px; width: 1060px; height: 500px; }
  #tl .band { position: absolute; left: 0; top: 0; }
  .node { position: absolute; width: 190px; text-align: center; }
  .node .dot { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 5px solid var(--sky); margin: 0 auto; box-sizing: border-box; }
  .node .lb { margin-top: 12px; font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.3; background: rgba(255,255,255,.85); border-radius: 12px; padding: 8px 6px; }
  .node .lb small { display: block; font-size: 16px; color: #6B7A90; font-weight: 400; margin-top: 2px; }
  .node.hot .dot { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 8px rgba(47,93,159,.18); }
  .node.hot .lb { color: var(--ink); box-shadow: 0 12px 30px rgba(47,93,159,.18); }
  .node.hot .lb { font-size: 24px; }
  .foot { left: 150px; top: 920px; }
</style>
</head>
<body>
<div id="stage">
  <div class="halo blue" style="left:-300px;top:-350px;width:1200px;height:1200px;"></div>
  <div class="halo white" style="left:1000px;top:400px;width:1200px;height:1200px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1250px;top:-300px;"></div>
  <div class="bokeh soft bk" style="left:1750px;top:120px;width:140px;height:140px;"></div>
  <div class="bokeh bk" style="left:900px;top:900px;width:34px;height:34px;"></div>

  <div class="title" data-init="o:0,y:30">
    <div class="h2">產出 2・接觸點與時機</div>
    <div class="sub">針對目標客群的 AI 溝通計畫</div>
  </div>
  <div id="lead" data-init="o:0,x:30">名單不只是警示，而是關懷的起點 <span class="tag demo">示意</span></div>

  <!-- 服務廠櫃檯：客戶關係專員（制服背心）-->
  <div id="counter" class="panel tint" data-base="perspective(1500px) rotateY(12deg) rotateX(3deg)" data-init="o:0,y:40,s:.96">
    <svg width="460" height="430" viewBox="50 0 460 430">
      <rect x="40" y="40" width="480" height="24" rx="8" fill="#DCE8F5"/>
      <text x="280" y="110" text-anchor="middle" font-size="26" font-weight="700" fill="#2F5D9F">服務廠・客戶關係櫃檯</text>
      <g class="fig advisor" transform="translate(120,120) scale(1.3)">
        <path class="cloth" d="M50 120 h120 a30 30 0 0 1 30 30 v70 h-180 v-70 a30 30 0 0 1 30 -30z"/>
        <path class="shirt" d="M88 120 h44 l-22 70z"/>
        <circle class="skin" cx="110" cy="80" r="44"/>
        <path class="hair" d="M66 74 a44 44 0 0 1 88 0 v18 a44 44 0 0 1 -88 0z"/>
      </g>
      <rect x="40" y="330" width="480" height="40" rx="12" fill="#C7DBF1"/>
      <rect x="60" y="370" width="440" height="40" rx="10" fill="#DCE8F5"/>
    </svg>
  </div>
  <div id="listcard" class="panel" data-base="perspective(1500px) rotateY(-6deg)" data-init="o:0,y:30,s:.96">
    <div class="t"><span>今日關懷名單</span><span class="tag demo">示意</span></div>
    <div class="rowx"><i style="background:var(--red)"></i><b></b><span>過保精算派</span></div>
    <div class="rowx"><i style="background:var(--yellow)"></i><b></b><span>品質失望派</span></div>
    <div class="rowx"><i style="background:var(--red)"></i><b></b><span>靜默出走者</span></div>
    <div class="rowx"><i style="background:var(--blue)"></i><b></b><span>口碑建議者</span></div>
    <div class="rowx"><i style="background:var(--grey)"></i><b></b><span>觀察名單</span></div>
  </div>

  <!-- 時間軸：五個時機 -->
  <div id="tl">
    <svg class="band" width="1060" height="500" data-init="o:0">
      <path class="glowpath" d="M 0 250 C 200 200, 300 300, 530 250 S 860 200, 1060 250"/>
      <path class="corepath" d="M 0 250 C 200 200, 300 300, 530 250 S 860 200, 1060 250"/>
      <path class="edgepath" d="M 0 250 C 200 200, 300 300, 530 250 S 860 200, 1060 250"/>
    </svg>
    <div class="node n1" style="left:0px;top:215px" data-init="o:0,y:20"><div class="dot"></div><div class="lb">保固到期前<br>60 天<small>過保精算派</small></div></div>
    <div class="node n2" style="left:215px;top:60px" data-init="o:0,y:20"><div class="lb">回廠間隔逾<br>建議週期 1.5 倍<small>回廠提醒</small></div><div class="dot" style="margin-top:12px"></div></div>
    <div class="node n3" style="left:435px;top:215px" data-init="o:0,y:20"><div class="dot"></div><div class="lb">刪項之後的<br>第一次回廠<small>品質失望派</small></div></div>
    <div class="node n4" style="left:650px;top:60px" data-init="o:0,y:20"><div class="lb">客訴結案後<br>第 7 天<small>客訴回訪</small></div><div class="dot" style="margin-top:12px"></div></div>
    <div class="node n5" style="left:870px;top:215px" data-init="o:0,y:20"><div class="dot"></div><div class="lb">待料逾<br>7 天<small>待料關懷</small></div></div>
  </div>
  <div class="foot note" data-init="o:0">五個時機：保固到期前 60 天／回廠間隔逾建議週期 1.5 倍／刪項後首次回廠／客訴結案第 7 天／待料逾 7 天・示意</div>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 16, lead: 0.4, in: 'glow', out: 'sweep',
  keys: { k_list: 0.1, k_advisor: 2.53, k_timeline: 5.78, k_t1: 8.08, k_t3: 10.26, k_t4: 12.62 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys;
Scene.tween('.title', 0.2, 0.9, { o: 1, y: 0 });
Scene.tween('#lead', K.k_list + 0.2, 0.8, { o: 1, x: 0 });
Scene.tween('#counter', K.k_advisor - 0.2, 0.9, { o: 1, y: 0, s: 1 });
Scene.float('#counter', 4, 5, 0.3);
Scene.tween('#listcard', K.k_advisor + 0.6, 0.8, { o: 1, y: 0, s: 1 });
Scene.float('#listcard', 4, 4.4, 1.5);
Scene.tween('#tl .band', K.k_timeline - 0.2, 1.0, { o: 1 });
[1, 2, 3, 4, 5].forEach(i => { Scene.tween('.n' + i, K.k_timeline + 0.1 + i * 0.18, 0.6, { o: 1, y: 0 }); Scene.float('.n' + i, 3, 4.2 + i * 0.3, i); });
Scene.tween('.foot', K.k_timeline + 1.4, 0.8, { o: 1 });
Scene.float('.bk', 10, 6, 0);
Scene.hook(t => {
  document.querySelector('.n1').classList.toggle('hot', t >= K.k_t1);
  document.querySelector('.n3').classList.toggle('hot', t >= K.k_t3);
  document.querySelector('.n4').classList.toggle('hot', t >= K.k_t4);
});
Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
