<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第 2 段：AI 逐句判讀與高風險議題</title>
<link rel="stylesheet" href="common.css">
<style>
  .title { left: 120px; top: 90px; }
  .title .sub { font-size: 26px; color: #6B7A90; margin-top: 8px; }
  /* 問句 */
  #question { left: 430px; top: 230px; width: 620px; height: 84px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; }
  /* 顯示卡 */
  #gpu { left: 530px; top: 370px; width: 420px; height: 230px; }
  #gpu svg { transform: scale(1.12); transform-origin: center; }
  #gpu .lbl { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font-size: 22px; color: var(--navy); font-weight: 500; }
  /* 四格 */
  #tiles { left: 1080px; top: 340px; width: 220px; }
  .tile { width: 220px; height: 64px; margin-bottom: 14px; border-radius: 14px; background: #fff; box-shadow: 0 10px 24px rgba(47,93,159,.12); display: flex; align-items: center; gap: 14px; padding: 0 18px; box-sizing: border-box; font-size: 26px; font-weight: 700; color: var(--navy); }
  .tile i { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .tile.c0 i { background: #B7C2D0; } .tile.c1 i { background: var(--yellow); } .tile.c2 i { background: #D9826F; } .tile.c3 i { background: var(--red); }
  .tile.on { box-shadow: 0 0 0 3px rgba(47,93,159,.35), 0 10px 30px rgba(47,93,159,.25); color: var(--ink); }
  .tile.c3.on { box-shadow: 0 0 0 3px rgba(192,57,43,.45), 0 10px 30px rgba(192,57,43,.25); }
  /* 句子泡泡 */
  .sent { width: 210px; height: 64px; background: #fff; border-radius: 12px; box-shadow: 0 10px 24px rgba(47,93,159,.14); padding: 10px 14px; box-sizing: border-box; margin: -32px 0 0 -105px; border: 3px solid transparent; }
  .sent .ln { height: 11px; border-radius: 6px; background: var(--light); margin-bottom: 8px; }
  .sent .tg { font-size: 14px; color: #8A96A8; line-height: 1; }
  .sent.c1 { border-color: var(--yellow); } .sent.c2 { border-color: #D9826F; } .sent.c3 { border-color: var(--red); }
  /* 流失句卡 */
  #churn { left: 1380px; top: 250px; width: 440px; height: 230px; padding: 22px 28px; box-sizing: border-box; }
  #churn .lbl { font-size: 24px; color: var(--navy); display: flex; justify-content: space-between; align-items: center; }
  #churn .num { font-size: 96px; margin-top: 4px; }
  #churn .num small { font-size: 34px; color: var(--navy); margin-left: 6px; }
  #silent { left: 1380px; top: 500px; width: 440px; height: 200px; padding: 22px 28px; box-sizing: border-box; border-left: 10px solid var(--red); }
  #silent .num { font-size: 84px; color: var(--red); margin-top: 2px; }
  #silent .num small { font-size: 30px; color: var(--navy); margin-left: 6px; }
  #silent .lbl { font-size: 24px; color: var(--navy); }
  /* 九面向長條圖 */
  #chart { left: 150px; top: 230px; width: 1150px; height: 600px; padding: 30px 40px; box-sizing: border-box; }
  #chart .hd { display: flex; justify-content: space-between; align-items: baseline; }
  #chart .rows { margin-top: 18px; }
  .row { display: grid; grid-template-columns: 200px 1fr 130px; align-items: center; height: 46px; gap: 16px; }
  .row .nm { font-size: 26px; font-weight: 700; color: var(--ink); text-align: right; }
  .row .nm.faint { color: #9AA6B8; font-weight: 400; font-size: 22px; }
  .row .trk { height: 26px; border-radius: 13px; background: var(--pale); position: relative; overflow: hidden; }
  .row .trk i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 13px; background: var(--sky); transform-origin: left; }
  .row.r0 .trk i { background: var(--red); } .row.r1 .trk i { background: var(--yellow); }
  .row .val { font-size: 30px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .row .val.faint { color: #9AA6B8; font-size: 20px; font-weight: 400; }
  .row.hl .nm { font-size: 30px; }
  .row.r0.hl .val { color: var(--red); text-shadow: 0 0 16px rgba(192,57,43,.35); }
  .row.r1.hl .val { color: #B98800; }
  #chart .rank { position: absolute; font-size: 22px; font-weight: 700; color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="stage">
  <div class="halo blue" style="left:-300px;top:-300px;width:1200px;height:1200px;"></div>
  <div class="halo white" style="left:1000px;top:500px;width:1100px;height:1100px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:1300px;top:-300px;"></div>
  <div class="beam" data-base="rotate(22deg)" style="left:300px;top:-300px;opacity:.3"></div>
  <div class="bokeh soft bk" style="left:1650px;top:820px;width:150px;height:150px;"></div>
  <div class="bokeh bk" style="left:1200px;top:880px;width:34px;height:34px;"></div>
  <div class="bokeh soft bk" style="left:200px;top:860px;width:110px;height:110px;"></div>
  <div class="bokeh bk" style="left:1500px;top:150px;width:26px;height:26px;"></div>

  <div class="title" data-init="o:0,y:30">
    <div class="h2">產出 1・AI 逐句判讀</div>
    <div class="sub">本機模型・流失句與高風險議題</div>
  </div>

  <!-- 判讀畫面 -->
  <svg class="band" width="1920" height="1080" style="left:0;top:0" id="band2" data-init="o:0">
    <path class="glowpath" d="M -100 520 C 300 520, 400 480, 760 490 S 1000 520, 1080 500"/>
    <path class="corepath" d="M -100 520 C 300 520, 400 480, 760 490 S 1000 520, 1080 500"/>
  </svg>
  <div id="sents" style="left:0;top:0;width:0;height:0"></div>
  <div id="question" class="panel deep" data-init="o:0,y:-20,s:.96">這句話，有沒有離開原廠的意思？</div>
  <div id="gpu" data-init="o:0,y:30">
    <svg width="420" height="230" viewBox="0 0 420 230">
      <rect x="10" y="40" width="400" height="150" rx="18" fill="#44546A"/>
      <rect x="22" y="52" width="376" height="126" rx="12" fill="#2F5D9F"/>
      <circle cx="130" cy="115" r="46" fill="#DCE8F5"/><circle cx="130" cy="115" r="30" fill="#2F5D9F"/><circle cx="130" cy="115" r="9" fill="#DCE8F5"/>
      <g id="fan1" transform="translate(130,115)"><path d="M0 -28 a28 28 0 0 1 20 20 L0 0z M0 28 a28 28 0 0 1 -20 -20 L0 0z M-28 0 a28 28 0 0 1 20 -20 L0 0z M28 0 a28 28 0 0 1 -20 20 L0 0z" fill="#9FC2E8"/></g>
      <circle cx="290" cy="115" r="46" fill="#DCE8F5"/><circle cx="290" cy="115" r="30" fill="#2F5D9F"/><circle cx="290" cy="115" r="9" fill="#DCE8F5"/>
      <g id="fan2" transform="translate(290,115)"><path d="M0 -28 a28 28 0 0 1 20 20 L0 0z M0 28 a28 28 0 0 1 -20 -20 L0 0z M-28 0 a28 28 0 0 1 20 -20 L0 0z M28 0 a28 28 0 0 1 -20 20 L0 0z" fill="#9FC2E8"/></g>
      <rect x="60" y="190" width="300" height="14" rx="4" fill="#9FC2E8"/>
      <rect x="10" y="20" width="400" height="22" rx="6" fill="#DCE8F5"/>
    </svg>
    <div class="lbl">本機 AI 模型・逐句判讀<span class="tag demo" style="margin-left:10px">示意</span></div>
  </div>
  <div id="tiles" data-init="o:0,x:30">
    <div class="tile c0"><i></i>無</div>
    <div class="tile c1"><i></i>不滿</div>
    <div class="tile c2"><i></i>考慮離開</div>
    <div class="tile c3"><i></i>已離開</div>
  </div>

  <!-- 數字卡 -->
  <div id="churn" class="panel" data-base="perspective(1500px) rotateY(-10deg)" data-init="o:0,x:60,s:.96">
    <div class="lbl"><span>被標為流失句</span><span class="tag demo">示意</span></div>
    <div class="num"><span id="n1671">0</span><small>句</small></div>
    <div class="note">21,183 句中，有離開原廠意思的句子</div>
  </div>
  <div id="silent" class="panel" data-base="perspective(1500px) rotateY(-10deg)" data-init="o:0,x:60,s:.96">
    <div class="lbl">沒有抱怨，就直接在找出口</div>
    <div class="num"><span id="n186">0</span><small>句</small></div>
    <div class="note">流失句中「無抱怨」者</div>
  </div>

  <!-- 九面向長條圖 -->
  <div id="chart" class="panel" data-base="perspective(1600px) rotateY(6deg)" data-init="o:0,y:50,s:.96">
    <div class="hd"><div class="h2">車主最在意的事・九面向流失率</div><span class="tag demo">示意</span></div>
    <div class="rows" id="rows"></div>
    <div class="note" style="position:absolute;left:40px;right:40px;bottom:18px;font-size:18px">流失率＝該面向語句中被判為流失句的比例。僅標示旁白提到的兩項，其餘七面向淡色示意、數值略。論壇公開資料 2007–2026/9</div>
  </div>

  <div id="subtitle"></div>
  <div id="sweep"><div class="veil"></div><div class="band-light"></div></div>
  <div id="glow"><div class="ring"></div><div class="core"></div></div>
</div>

<script src="common.js"></script>
<script>
const S = Scene.init({
  T: 28, lead: 1.3, in: 'glow', out: 'none', din: 0.8,
  keys: { k_model: 0.1, k_question: 3.1, k_1671: 7.3, k_186: 10.43, k_bar: 16.46, k_parts: 20.04, k_price: 22.6 },
  cues: [{text:'（預覽）字幕由 render.py 注入', start: 0, show_end: 999}],
});
const K = S.keys, L = S.lead;

Scene.tween('.title', 0.3, 0.9, { o: 1, y: 0 });
Scene.tween('#gpu', K.k_model + 0.2, 0.9, { o: 1, y: 0 });
Scene.tween('#band2', K.k_model + 0.4, 1.0, { o: 1 });
Scene.tween('#band2', K.k_bar - 0.3, 0.6, { o: 0 }, { e: 'in' });
Scene.tween('#tiles', K.k_model + 0.7, 0.8, { o: 1, x: 0 });
Scene.tween('#question', K.k_question - 0.1, 0.7, { o: 1, y: 0, s: 1 });
Scene.float('#question', 3, 4.6, 0.4);
Scene.tween('#churn', K.k_1671 - 0.2, 0.9, { o: 1, x: 0, s: 1 });
Scene.float('#churn', 4, 5.0, 1.2);
Scene.tween('#silent', K.k_186 - 0.1, 0.9, { o: 1, x: 0, s: 1 });
Scene.float('#silent', 4, 5.4, 2.4);
// 切到長條圖：判讀畫面退場
Scene.tween('#gpu', K.k_bar - 0.3, 0.7, { o: 0, x: -80 }, { e: 'in' });
Scene.tween('#tiles', K.k_bar - 0.3, 0.7, { o: 0, x: -80 }, { e: 'in' });
Scene.tween('#question', K.k_bar - 0.3, 0.6, { o: 0, y: -30 }, { e: 'in' });
Scene.tween('#chart', K.k_bar + 0.2, 1.0, { o: 1, y: 0, s: 1 });
Scene.float('#chart', 3, 6, 0.8);
Scene.float('.bk', 10, 6, 0);

// --- 長條圖資料：只用第四節的數字；其餘七面向淡色、無數值 ---
const rowsData = [
  { nm: '零件供應', v: 17.3, show: true },
  { nm: '價格', v: 15.0, show: true },
  { nm: '其他面向', v: 11.5 }, { nm: '其他面向', v: 10.2 }, { nm: '其他面向', v: 9.0 }, { nm: '其他面向', v: 8.1 },
  { nm: '其他面向', v: 7.2 }, { nm: '其他面向', v: 6.4 }, { nm: '其他面向', v: 5.5 },
];
const rowsEl = document.getElementById('rows');
rowsEl.innerHTML = rowsData.map((r, i) => `<div class="row r${i}">
  <div class="nm ${r.show ? '' : 'faint'}">${r.nm}</div><div class="trk"><i class="bar b${i}"></i></div>
  <div class="val ${r.show ? '' : 'faint'}">${r.show ? r.v.toFixed(1) + '%' : ''}</div></div>`).join('');
rowsData.forEach((r, i) => Scene.tween('.b' + i, K.k_bar + 0.8 + i * 0.12, 0.9, { sx: r.v / 20 }, { from: { sx: 0 } }));

// --- 句子流過模型（決定論）---
const classes = [0, 1, 0, 3, 1, 2, 0, 3, 1, 0, 2, 3, 0, 1, 3, 0];
const R = Scene.rng(99);
const NS = classes.length, GAP = 0.8, TRAVEL = 3.4, X0 = -200, X1 = 1040, Y = 500;
const box = document.getElementById('sents');
const sents = classes.map((c, i) => {
  const el = document.createElement('div'); el.className = 'sent abs';
  el.innerHTML = `<div class="ln" style="width:${55 + Math.floor(R() * 40)}%"></div><div class="ln" style="width:${30 + Math.floor(R() * 50)}%"></div><div class="tg">論壇句・示意</div>`;
  box.appendChild(el);
  return { el, c, t0: K.k_model + 0.9 + i * GAP };
});
const tiles = [...document.querySelectorAll('.tile')];
const n1671 = document.getElementById('n1671'), n186 = document.getElementById('n186');
Scene.hook(t => {
  n1671.textContent = Scene.fmt(Math.round(1671 * Scene.prog(t, K.k_1671, 1.6)));
  n186.textContent = Scene.fmt(Math.round(186 * Scene.prog(t, K.k_186, 1.2)));
  const fade = 1 - Scene.prog(t, K.k_bar - 0.3, 0.6, 'in');  // 切圖時整體淡出
  const lit = new Set();
  for (const s of sents) {
    const q = (t - s.t0) / TRAVEL;
    if (q < 0 || q > 1) { s.el.style.opacity = 0; continue; }
    const x = Scene.lerp(X0, X1, q);
    const y = Y + Math.sin(q * 6.28 + s.c) * 10;
    const past = q > 0.62;                     // 通過模型後顯示判讀結果
    s.el.className = 'sent abs' + (past && s.c ? ' c' + s.c : '');
    const o = Math.min(1, q / 0.08) * (q > 0.9 ? 1 - (q - 0.9) / 0.1 : 1) * fade;
    s.el.style.opacity = o;
    const sc = q > 0.9 ? 1 - (q - 0.9) * 3 : (q > 0.45 && q < 0.62 ? 0.85 : 1);
    s.el.style.transform = `translate(${x}px,${y}px) scale(${sc})`;
    if (q > 0.62 && q < 0.95) lit.add(s.c);
  }
  tiles.forEach((tl, i) => tl.classList.toggle('on', lit.has(i)));
  // 風扇轉動
  const ang = (t * 240) % 360;
  document.getElementById('fan1').setAttribute('transform', `translate(130,115) rotate(${ang})`);
  document.getElementById('fan2').setAttribute('transform', `translate(290,115) rotate(${-ang})`);
  // 長條：旁白講到時強調
  document.querySelector('.row.r0').classList.toggle('hl', t >= K.k_parts);
  document.querySelector('.row.r1').classList.toggle('hl', t >= K.k_price);
});

Scene.seek(0);
Scene.preview();
</script>
</body>
</html>
